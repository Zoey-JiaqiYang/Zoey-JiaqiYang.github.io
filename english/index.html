<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Zoey's English Desk</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=Caveat:wght@500;700&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌸</text></svg>">
</head>
<body>
  <!-- hand-drawn SVG filter: slightly wobbly strokes -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <filter id="wobble"><feTurbulence type="fractalNoise" baseFrequency="0.03" numOctaves="2" seed="3"/><feDisplacementMap in="SourceGraphic" scale="2.2"/></filter>
  </svg>

  <div class="page">
    <!-- ───── Header ───── -->
    <header class="top">
      <div class="hello">
        <p class="date" id="todayLabel"></p>
        <h1><span id="greeting">Good Morning</span>, Zoey <span class="wave">☁️</span></h1>
        <svg class="squiggle" viewBox="0 0 220 14" aria-hidden="true"><path d="M2 8 C 20 2, 35 13, 55 7 S 90 2, 110 8 S 150 13, 170 7 S 205 3, 218 8" /></svg>
        <p class="sub">今天 10 分钟：5 个单词 + 3 条热点</p>
      </div>
      <div class="today-progress">
        <div class="pill" id="pillWords"><span class="dot"></span>单词 <b id="pWords">0/5</b></div>
        <div class="pill" id="pillNews"><span class="dot"></span>热点 <b id="pNews">0/3</b></div>
      </div>
    </header>

    <!-- ───── Check-in calendar (≈1/3 screen) ───── -->
    <section class="card calendar-card" id="calendar">
      <div class="cal-stats">
        <div class="streak">
          <span class="flame">🔥</span>
          <div><b id="streakNum">0</b><small>天连续打卡</small></div>
        </div>
        <div class="mini-stats">
          <div><b id="statDays">0</b><small>累计打卡</small></div>
          <div><b id="statWords">0</b><small>学过的词</small></div>
          <div><b id="statAcc">–</b><small>正确率</small></div>
          <div><b id="statQueue">0</b><small>待复习</small></div>
        </div>
        <div class="legend">
          <span><i class="lg full"></i>全部完成</span>
          <span><i class="lg part"></i>完成一半</span>
          <span><i class="lg none"></i>未打卡</span>
        </div>
      </div>
      <div class="cal-main">
        <div class="cal-head">
          <button class="icon-btn" id="calPrev" aria-label="上个月">‹</button>
          <h3 id="calTitle"></h3>
          <button class="icon-btn" id="calNext" aria-label="下个月">›</button>
        </div>
        <div class="cal-grid" id="calGrid"></div>
      </div>
    </section>

    <div class="row">
      <!-- ───── Daily 5 words ───── -->
      <section class="card words-card" id="words">
        <div class="card-head">
          <div>
            <span class="chip chip-pink">Daily 5</span>
            <h2>今日单词</h2>
          </div>
          <div class="steps" id="wordSteps"></div>
        </div>
        <div id="quiz"></div>
      </section>

      <!-- ───── Dictionary ───── -->
      <section class="card dict-card" id="dict">
        <div class="card-head">
          <div>
            <span class="chip chip-lav">Dictionary</span>
            <h2>随手查词</h2>
          </div>
          <span class="hand-note">查过的词会在 1–3 天内考你 ✎</span>
        </div>
        <form class="search" id="dictForm" autocomplete="off">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
          <input id="dictInput" type="search" placeholder="输入英文或中文，回车查询" enterkeyhint="search">
        </form>
        <div id="dictResult" class="dict-result"></div>
        <div class="notebook">
          <div class="nb-head">
            <h4>我的生词本 <small id="nbCount"></small></h4>
            <button class="link-btn" id="nbToggle">展开全部</button>
          </div>
          <ul id="nbList" class="nb-list"></ul>
        </div>
      </section>
    </div>

    <!-- ───── Daily 3 news ───── -->
    <section class="card news-card" id="news">
      <div class="card-head">
        <div>
          <span class="chip chip-lime">Daily 3</span>
          <h2>今日热点</h2>
        </div>
        <div class="news-tools">
          <div class="seg" id="langSeg" role="tablist">
            <button data-lang="en">EN</button>
            <button data-lang="both">双语</button>
            <button data-lang="zh">中文</button>
          </div>
          <div class="news-nav">
            <button class="icon-btn" id="newsPrev" aria-label="前一天">‹</button>
            <span id="newsDate"></span>
            <button class="icon-btn" id="newsNext" aria-label="后一天">›</button>
          </div>
        </div>
      </div>
      <p class="hand-note news-hint">小技巧：高亮词点一下看释义，双击正文里任意单词直接查词 ✎</p>
      <div id="newsList" class="news-list"></div>
    </section>

    <footer class="foot">每天 9:00 前自动更新热点 · 学习记录保存在这个浏览器里</footer>
  </div>

  <div class="toast" id="toast"></div>
  <div class="celebrate" id="celebrate" hidden>
    <div class="stamp big">DONE<small id="celebrateDate"></small></div>
    <p>今日打卡完成！明天见 🌷</p>
  </div>

  <script src="words.js"></script>
  <script src="app.js"></script>
</body>
</html>
